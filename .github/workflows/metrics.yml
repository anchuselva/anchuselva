name: Generate profile metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    name: Generate developer dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate GitHub overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anchuselva
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Colombo
          config_display: columns
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub overview metrics [skip ci]"
          retries: 2
          retries_delay: 120

      - name: Generate language analytics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anchuselva
          filename: metrics-languages.svg
          template: classic
          config_timezone: Asia/Colombo
          config_display: large
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          output_action: commit
          committer_branch: main
          committer_message: "chore: update language metrics [skip ci]"
          retries: 2
          retries_delay: 120

      - name: Generate repository growth
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anchuselva
          filename: metrics-growth.svg
          template: classic
          config_timezone: Asia/Colombo
          config_display: large
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_days: 30
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph
          output_action: commit
          committer_branch: main
          committer_message: "chore: update repository growth metrics [skip ci]"
          retries: 2
          retries_delay: 120

      # Optional integrations from the reference dashboards:
      # - WakaTime requires a WAKATIME_TOKEN repository secret.
      # - Stack Overflow requires the user's numeric Stack Overflow ID.
